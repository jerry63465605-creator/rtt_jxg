<h2>军需官 · 次要战场</h2>

<p>一款<b>卡驱 + 区域控制</b>的二战题材兵棋（自研变体规则）。2 名玩家分别操控
<b>轴心国</b>与<b>同盟国</b>，各自指挥多个国家的部队。</p>

<h3>核心机制</h3>
<ul>
	<li><b>补给</b>：从补给点向外传播，断补的部队会被移除</li>
	<li><b>建造 / 征召</b>：在本土或补给线延伸处投放新部队</li>
	<li><b>战斗</b>：相邻地区之间确定性移除（无骰）</li>
	<li><b>海峡</b>：控制海峡所在陆地的阵营，独享两侧海域的连通</li>
</ul>

<h3>阵营</h3>
<table>
	<tr><th>玩家位</th><th>操控国家</th></tr>
	<tr><td>轴心国</td><td>德国、日本、意大利</td></tr>
	<tr><td>同盟国</td><td>英国（+法国）、苏联、美国（+中国）</td></tr>
</table>
